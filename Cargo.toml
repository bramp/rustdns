# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[package]
name = "rustdns"
version = "0.7.0"
authors = ["Andrew Brampton <me@bramp.net>"]
categories = ["encoding", "network-programming"]
description = "A DNS parsing library"
edition = "2024"
rust-version = "1.85"
keywords = ["dns", "idna", "serialization"]
license = "Apache-2.0"
readme = "README.md"
repository = "https://github.com/bramp/rustdns"

[workspace]
resolver = "3"
members = [
    "generate_tests",   # Used to generate test data (by querying real servers)
    "dig",              # Example dig client
    # "nslookup",         # Example nslookup client
]

[features]
default = ["clients", "zones"]

# Enable the DNS clients (asynchronous, plus the blocking variants).
clients = ["doh", "json", "do53", "dot", "sync"]

# Classic DNS (Do53): asynchronous UDP and TCP clients, plus a combined client
# that retries over TCP when a UDP response is truncated.
do53 = ["dep:tokio"]

# Blocking variants of the enabled clients, under `rustdns::clients::sync`.
sync = []

# DNS over HTTPS (DoH) client (rfc8484).
doh  = ["http_deps", "base64"]

# DNS over HTTPS JSON client
json = ["http_deps", "serde", "serde_json"]

# DNS over TLS client (DoT, rfc7858).
dot = ["dep:tokio", "dep:rustls", "dep:tokio-rustls", "dep:webpki-roots"]

# Enable the Zone Parser
zones = ["pest", "pest_consume", "pest_derive"]

# A private feature for common http dependencies.
http_deps = ["http", "url", "hyper", "hyper-util", "hyper-rustls", "http-body-util", "mime"]

[dependencies]

# Used for the web clients
http = { version = "1.5.0", optional = true }
http-body-util = { version = "0.1.5", optional = true }
url = { version = "2.5.8", optional = true }
hyper = { version = "1.11", features = ["client", "http1", "http2"], optional = true }
hyper-util = { version = "0.1.20", features = ["client-legacy", "tokio", "http1", "http2"], optional = true }
hyper-rustls = { version = "0.27.9", default-features = false, features = ["webpki-tokio", "http1", "http2", "ring"], optional = true }
mime = { version = "0.3.17", optional = true }

# Needed for DNS over TLS (DoT)
rustls = { version = "0.23.43", default-features = false, features = ["ring", "std"], optional = true }
tokio-rustls = { version = "0.26.5", default-features = false, features = ["ring"], optional = true }
webpki-roots = { version = "1.0.9", optional = true }

# Needed for DNS over HTTP (DoH)
base64 = { version = "0.23.1", optional = true }

# Needed for DNS over HTTP Json
serde = { version = "1.0.229", features = ["derive"], optional = true }
serde_json = { version = "1.0.151", optional = true }

# Needed for Zone file parsing
pest = { version = "2.9.0", optional = true }
pest_consume = { version = "1.1.3", optional = true }
pest_derive = { version = "2.9.0", optional = true }

# Needed for fuzzing
arbitrary = { version = "1.4", features = ["derive"], optional = true }

# Everything else
async-trait = "0.1.92"
chrono = "0.4.45"
byteorder = "1.5.0"
bytes = "1.12.1"
educe = "0.6.0"
idna = "1.1.0"
lazy_static = "1.5.0"
log = "0.4.34"
num-derive = "0.5.1"
num-traits = "0.2.19"
rand = "0.10.2"
regex = "1.13.1"
socket2 = "0.6.5"
strum = "0.28.0"
strum_macros = "0.28.0"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["net", "time", "sync", "io-util"], optional = true }

###

[dev-dependencies]
env_logger = "0.11.11"
hex = "0.4.3"
pretty_assertions = "1.4.1"
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
yaml_serde = "0.10.7"
json_comments = "0.2.2"
test-env-log = "0.2.8"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread"] }

[package.metadata.cargo-all-features]
skip_optional_dependencies = true
denylist = ["http_deps"]
