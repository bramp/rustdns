[package]
name = "web-dig"
version = "0.1.0"
edition = "2024"
rust-version = "1.87"
description = "WebAssembly DNS dig tool using rustdns"
authors = ["Andrew Brampton <me@bramp.net>"]
license = "Apache-2.0"
repository = "https://github.com/bramp/rustdns"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
rustdns = { path = "../", default-features = false, features = ["exchanger", "json", "dnssec-rustcrypto"] }
async-trait = "0.1.92"
base64 = "0.23.1"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"

[target.'cfg(target_arch = "wasm32")'.dependencies]
web-sys = { version = "0.3", features = [
    "Headers",
    "Request",
    "RequestInit",
    "RequestMode",
    "Response",
    "Window",
    "Performance",
    "AbortController",
    "AbortSignal",
] }

[dev-dependencies]
pretty_assertions = "1.4.1"

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "0.3"

[build-dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
