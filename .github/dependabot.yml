version: 2
updates:
  # Keep Rust/Cargo dependencies up to date
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      # Wait a week before opening PRs for major updates, giving others time
      # to find bugs/security issues in the new release.
      semver-major-days: 7

  # Keep GitHub Actions up to date
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      # Wait a week before opening PRs for major updates, giving others time
      # to find bugs/security issues in the new release.
      semver-major-days: 7
