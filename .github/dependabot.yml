version: 2
updates:
  # Keep Rust/Cargo dependencies up to date.
  # This covers the main workspace (root, generate_tests, dig).
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      # Wait a week before opening PRs for major updates, giving others time
      # to find bugs/security issues in the new release.
      semver-major-days: 7

  # The fuzz/ crate is deliberately excluded from the main workspace (see
  # fuzz/Cargo.toml), so it needs its own entry to be kept up to date.
  - package-ecosystem: "cargo"
    directory: "/fuzz"
    schedule:
      interval: "weekly"
    cooldown:
      semver-major-days: 7

  # Keep GitHub Actions up to date
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      # Wait a week before opening PRs for major updates, giving others time
      # to find bugs/security issues in the new release.
      semver-major-days: 7
